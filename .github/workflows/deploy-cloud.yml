name: Deploy to Cloudflare Workers

# main に push したら https://go3v3.shimeji9.workers.dev に自動デプロイする。
# リポジトリの Settings → Secrets and variables → Actions に
#   CLOUDFLARE_API_TOKEN(「Edit Cloudflare Workers」テンプレートで作ったトークン)
#   CLOUDFLARE_ACCOUNT_ID
# を登録すると有効になる。未登録のあいだは何もせずに成功で終わる。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未登録なのでデプロイしません"; fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - if: steps.check.outputs.ok == 'true'
        run: npm ci && npm test
      - if: steps.check.outputs.ok == 'true'
        working-directory: cloud
        run: npm ci && npm run typecheck && npm test && npm run deploy
